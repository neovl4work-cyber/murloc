# Android SDK. Если AGP падает с IOException "файл занят другим процессом" в SdkLocator
# (чтение sdk.dir из local.properties блокируется на Windows) — уберите sdk.dir отсюда
# и задайте SDK через переменные окружения ANDROID_HOME / ANDROID_SDK_ROOT.
sdk.dir=D:\\Android\\Sdk

storeFile=keystore.jks
storePassword=******
keyAlias=release
keyPassword=******
